[project]
name = "part-1-project-team-10"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "bcrypt>=5.0.0",
    "PyQt6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/productivity_app"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
